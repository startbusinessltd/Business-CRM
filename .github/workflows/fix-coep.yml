name: Fix CloudFront COEP

# Cross-Origin-Embedder-Policy on the marketing distribution puts bsoft.ltd into
# cross-origin isolation, which makes Chrome refuse ANY cross-origin iframe whose
# document does not itself send a COEP header. Google's Maps embed does not send
# one, so the contact-page map renders as "www.google.com refused to connect".
#
# The site uses no SharedArrayBuffer / Atomics / wasm threads, so it gains nothing
# from isolation. This workflow removes just that one header.
#
# NOTE: COEP is NOT part of CloudFront's SecurityHeadersConfig (that only covers
# HSTS, X-Frame-Options, CSP, Referrer-Policy, X-Content-Type-Options, XSS). It can
# only come from CustomHeadersConfig, an edge function, or S3 object metadata - so
# all of those are checked here.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = report only, changes nothing. apply = remove COEP + invalidate.'
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - apply

concurrency:
  group: cloudfront-coep
  cancel-in-progress: false

jobs:
  coep:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SITE_URL: https://bsoft.ltd
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Header as currently served
        run: curl -sI "$SITE_URL/contact" | grep -i '^cross-origin' || echo '(no cross-origin headers)'

      # Everything below prints to stdout, not just the job summary, so a failed
      # run can be diagnosed from the log alone.
      - name: Inspect distribution
        id: locate
        run: |
          set -euo pipefail
          aws cloudfront get-distribution-config --id "${{ secrets.CF_DIST_ID }}" > dist.json

          echo "--- default behaviour ---"
          jq '.DistributionConfig.DefaultCacheBehavior
              | {ResponseHeadersPolicyId, FunctionAssociations, LambdaFunctionAssociations}' dist.json

          echo "--- all cache behaviours ---"
          jq -r '[.DistributionConfig.CacheBehaviors.Items[]?
                  | {p: .PathPattern, r: .ResponseHeadersPolicyId}]' dist.json

          RHP=$(jq -r '.DistributionConfig.DefaultCacheBehavior.ResponseHeadersPolicyId // ""' dist.json)
          echo "rhp=$RHP" >> "$GITHUB_OUTPUT"
          echo "response headers policy: ${RHP:-<none attached>}"

      - name: Read policy and find COEP
        id: check
        if: steps.locate.outputs.rhp != ''
        run: |
          set -euo pipefail
          RHP="${{ steps.locate.outputs.rhp }}"
          aws cloudfront get-response-headers-policy-config --id "$RHP" > pol.json
          jq '.ResponseHeadersPolicyConfig' pol.json > cfg.json

          echo "--- full policy config ---"
          cat cfg.json

          ETAG=$(jq -r '.ETag' pol.json)
          # COEP can only realistically live in CustomHeadersConfig.
          HAS=$(jq -r '[.CustomHeadersConfig.Items[]?
                        | select(.Header | ascii_downcase == "cross-origin-embedder-policy")]
                       | if length > 0 then "yes" else "no" end' cfg.json)
          MANAGED=$(aws cloudfront list-response-headers-policies --type managed \
            | jq -r --arg id "$RHP" '[.ResponseHeadersPolicyList.Items[]?.ResponseHeadersPolicy.Id]
                                     | index($id) | if . then "yes" else "no" end')

          echo "etag=$ETAG"       >> "$GITHUB_OUTPUT"
          echo "has_coep=$HAS"    >> "$GITHUB_OUTPUT"
          echo "managed=$MANAGED" >> "$GITHUB_OUTPUT"
          echo "COEP in custom headers: $HAS | managed policy: $MANAGED"

          if [ "$HAS" = "no" ]; then
            echo "::warning::COEP is not in this policy - it comes from an edge function or S3 object metadata."
          fi
          if [ "$MANAGED" = "yes" ]; then
            echo "::warning::Managed policies are read-only; a custom copy is required."
          fi

      - name: Remove COEP from the policy
        if: inputs.mode == 'apply' && steps.check.outputs.has_coep == 'yes' && steps.check.outputs.managed == 'no'
        run: |
          set -euo pipefail
          # Drop only the COEP entry and fix Quantity to match. COOP is deliberately
          # kept: it does not affect iframes, so removing it would weaken the site.
          jq '(.CustomHeadersConfig.Items) |= map(select(.Header | ascii_downcase != "cross-origin-embedder-policy"))
              | .CustomHeadersConfig.Quantity = (.CustomHeadersConfig.Items | length)' cfg.json > cfg.new.json
          diff <(jq -S . cfg.json) <(jq -S . cfg.new.json) || true

          aws cloudfront update-response-headers-policy \
            --id "${{ steps.locate.outputs.rhp }}" \
            --if-match "${{ steps.check.outputs.etag }}" \
            --response-headers-policy-config file://cfg.new.json > /dev/null
          echo "Removed Cross-Origin-Embedder-Policy."

      - name: Invalidate CloudFront
        if: inputs.mode == 'apply' && steps.check.outputs.has_coep == 'yes' && steps.check.outputs.managed == 'no'
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DIST_ID }}" \
            --paths "/*" --query "Invalidation.Id" --output text)
          echo "Invalidation: $ID"

      - name: Verify
        if: inputs.mode == 'apply' && steps.check.outputs.has_coep == 'yes' && steps.check.outputs.managed == 'no'
        run: |
          for i in $(seq 1 12); do
            sleep 20
            LEFT=$(curl -sI "$SITE_URL/contact" | grep -i '^cross-origin-embedder-policy' || true)
            if [ -z "$LEFT" ]; then echo "COEP gone after $((i*20))s - the map will render."; exit 0; fi
            echo "Attempt $i: still present"
          done
          echo "::error::Still served after 4 minutes - something else is re-adding it."
          exit 1

      - name: Nothing applied
        if: inputs.mode == 'inspect' || steps.check.outputs.has_coep != 'yes' || steps.check.outputs.managed == 'yes'
        run: echo "::notice::No change made. See the inspection output above for why."
